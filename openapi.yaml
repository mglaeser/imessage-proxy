openapi: 3.1.0
info:
  title: iMessage Proxy API
  version: 0.3.0
  summary: A narrow, authenticated iMessage proxy for trusted private networks.
  description: >-
    iMessage Proxy exposes a fixed, tightly validated set of read and send operations
    through a private Caddy facade; outbound targets are allowlisted. It is alpha
    software and must not be exposed to the Internet.
  license:
    name: Apache-2.0
    identifier: Apache-2.0
  contact:
    url: https://github.com/mglaeser/imessage-proxy
servers:
  - url: https://messages.example.internal:9443
    description: Replace with the operator's private iMessage Proxy endpoint.
security:
  - basicAuth: []
paths:
  /healthz:
    get:
      operationId: getHealth
      summary: Exercise the facade, bridge, and imsg read path.
      responses:
        "200":
          description: iMessage Proxy and the Messages read path are healthy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "408":
          $ref: "#/components/responses/RequestTimeout"
        "413":
          $ref: "#/components/responses/TooLarge"
        "431":
          $ref: "#/components/responses/HeadersTooLarge"
        "500":
          $ref: "#/components/responses/InternalError"
        "502":
          $ref: "#/components/responses/BadGateway"
        "503":
          $ref: "#/components/responses/Unavailable"
        "504":
          $ref: "#/components/responses/Timeout"
  /v1/rpc:
    post:
      operationId: callMessagesRpc
      summary: Run one allowlisted imsg JSON-RPC method.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RpcRequest"
      responses:
        "200":
          description: A correlated JSON-RPC result or upstream JSON-RPC error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RpcResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "408":
          $ref: "#/components/responses/RequestTimeout"
        "413":
          $ref: "#/components/responses/TooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "431":
          $ref: "#/components/responses/HeadersTooLarge"
        "500":
          $ref: "#/components/responses/InternalError"
        "502":
          $ref: "#/components/responses/BadGateway"
        "503":
          $ref: "#/components/responses/Unavailable"
        "504":
          $ref: "#/components/responses/Timeout"
  /v2/sessions/sms:
    post:
      operationId: sendSmsStyleMessage
      summary: Send an immediate iMessage through a simple SMS-style request.
      description: >-
        Sends to an allowlisted recipient through Messages.app using the iMessage
        service and AppleScript transport. A 204 response means the send command was
        accepted, not delivered. This endpoint never sends carrier SMS; callers must
        not blindly retry an ambiguous timeout.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SmsStyleSendRequest"
      responses:
        "204":
          description: Messages.app accepted the send command; no delivery confirmation is returned.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "408":
          $ref: "#/components/responses/RequestTimeout"
        "413":
          $ref: "#/components/responses/TooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "431":
          $ref: "#/components/responses/HeadersTooLarge"
        "500":
          $ref: "#/components/responses/InternalError"
        "502":
          $ref: "#/components/responses/BadGateway"
        "503":
          $ref: "#/components/responses/Unavailable"
        "504":
          $ref: "#/components/responses/Timeout"
components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: Use a distinct Caddy credential for each API client.
  responses:
    BadRequest:
      description: >-
        The request does not satisfy iMessage Proxy's narrow contract. When present,
        the body is either a bridge JSON error or facade diagnostic text.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/HttpError"
        text/plain:
          schema:
            type: string
    Unauthorized:
      description: >-
        Client or bridge credentials are missing or invalid. When present, the body
        is either a bridge JSON error or facade diagnostic text.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/HttpError"
        text/plain:
          schema:
            type: string
    Forbidden:
      description: >-
        The method, parameter, or send target is not allowed. When present, the body
        is either a bridge JSON error or facade diagnostic text.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/HttpError"
        text/plain:
          schema:
            type: string
    TooLarge:
      description: >-
        The request exceeds an iMessage Proxy size limit. When present, the body is
        either a bridge JSON error or facade diagnostic text.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/HttpError"
        text/plain:
          schema:
            type: string
    RequestTimeout:
      description: >-
        The client did not send or receive the bounded request in time. When present,
        the body is either a bridge JSON error or facade diagnostic text.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/HttpError"
        text/plain:
          schema:
            type: string
    HeadersTooLarge:
      description: >-
        The HTTP request headers exceed iMessage Proxy's 16 KiB limit. When present,
        the body is either a bridge JSON error or facade diagnostic text.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/HttpError"
        text/plain:
          schema:
            type: string
    UnsupportedMediaType:
      description: >-
        The endpoint requires application/json. When present, the body is either a
        bridge JSON error or facade diagnostic text.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/HttpError"
        text/plain:
          schema:
            type: string
    BadGateway:
      description: >-
        imsg failed or returned an invalid or oversized response. When present, the
        body is either a bridge JSON error or facade diagnostic text.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/HttpError"
        text/plain:
          schema:
            type: string
    InternalError:
      description: >-
        iMessage Proxy encountered an internal error. When present, the body is
        either a bridge JSON error or facade diagnostic text.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/HttpError"
        text/plain:
          schema:
            type: string
    Unavailable:
      description: >-
        The Messages read path is unavailable or iMessage Proxy is overloaded. When
        present, the body is a bridge JSON error or facade diagnostic text.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/HttpError"
        text/plain:
          schema:
            type: string
    Timeout:
      description: >-
        The bounded imsg request exceeded its deadline. When present, the body is a
        bridge JSON error or facade diagnostic text.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/HttpError"
        text/plain:
          schema:
            type: string
  schemas:
    JsonRpcId:
      oneOf:
        - type: string
          minLength: 1
          maxLength: 256
        - type: number
    Health:
      type: object
      additionalProperties: false
      required: [status, version]
      properties:
        status:
          const: ok
        version:
          type: string
    RpcRequest:
      type: object
      additionalProperties: false
      required: [jsonrpc, id, method]
      properties:
        jsonrpc:
          const: "2.0"
        id:
          $ref: "#/components/schemas/JsonRpcId"
        method:
          type: string
          enum:
            - chats.list
            - messages.history
            - messages.after
            - send
            - message.send_status
        params:
          type: object
          description: Method-specific parameters documented in docs/api.md.
    RpcResponse:
      type: object
      additionalProperties: true
      required: [jsonrpc, id]
      properties:
        jsonrpc:
          const: "2.0"
        id:
          $ref: "#/components/schemas/JsonRpcId"
        result: {}
        error:
          type: object
      oneOf:
        - required: [result]
          properties:
            error: false
        - required: [error]
          properties:
            result: false
    SmsStyleSendRequest:
      type: object
      additionalProperties: false
      required: [smsId, recipient, message]
      properties:
        smsId:
          type: string
          minLength: 1
          maxLength: 64
          description: >-
            Required opaque value; validated and discarded, never logged or returned,
            and not used for correlation, deduplication, or idempotency.
          example: request-1
        recipient:
          type: string
          minLength: 1
          maxLength: 256
          description: Exact allowlisted Messages recipient.
          example: person@example.net
        message:
          type: string
          minLength: 1
          maxLength: 460
          description: Text sent through Messages.app.
          example: Hello from iMessage Proxy
        sendAt:
          type: number
          const: -1
          deprecated: true
          description: Legacy immediate-send marker; omit it in new requests. Scheduling is not supported.
    HttpError:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: string
