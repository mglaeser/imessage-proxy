name-template: "iMessage Proxy v$RESOLVED_VERSION"
tag-template: "v$RESOLVED_VERSION"
change-template: "- $TITLE by @$AUTHOR in #$NUMBER"
no-changes-template: "- No user-facing changes"
categories:
  - title: "Breaking changes"
    labels:
      - breaking
  - title: "Features"
    labels:
      - enhancement
      - feature
  - title: "Fixes"
    labels:
      - bug
      - fix
  - title: "Security"
    labels:
      - security
  - title: "Documentation"
    labels:
      - documentation
  - title: "Maintenance"
    labels:
      - build
      - chore
      - ci
      - dependencies
exclude-labels:
  - skip-changelog
version-resolver:
  major:
    labels:
      - major
      - breaking
  minor:
    labels:
      - minor
      - enhancement
      - feature
  patch:
    labels:
      - patch
      - bug
      - fix
      - security
  default: patch
autolabeler:
  - label: documentation
    files:
      - "*.md"
      - "docs/**"
  - label: ci
    files:
      - ".github/**"
  - label: build
    files:
      - Makefile
      - ".clang-format"
      - ".editorconfig"
  - label: tests
    files:
      - "tests/**"
template: |
  ## What changed

  $CHANGES

  ## Contributors

  $CONTRIBUTORS

  Verify SHA256SUMS and the GitHub artifact attestation before using a release archive.
