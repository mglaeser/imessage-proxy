name: Feature request
description: Propose a focused improvement that preserves iMessage Proxy's security model
title: "[Feature]: "
labels:
  - enhancement
  - triage
body:
  - type: markdown
    attributes:
      value: |
        iMessage Proxy deliberately favors a narrow trust boundary over feature count. Explain the operator problem, not just a preferred implementation. Additional or unreviewed public-ingress paths, unrestricted host control, and weaker macOS protections are out of scope.
  - type: checkboxes
    id: preflight
    attributes:
      label: Preflight
      options:
        - label: I searched existing issues, discussions, and the roadmap.
          required: true
        - label: This proposal preserves scoped API-key authentication, Unix-socket isolation, the public-exposure gate, and normal macOS security controls.
          required: true
        - label: I have not included private infrastructure or personal message data.
          required: true
  - type: textarea
    id: problem
    attributes:
      label: Operator problem
      description: Who is affected, what are they trying to do, and why is the current behavior insufficient?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed outcome
      description: Describe observable behavior, not only implementation details.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Include workarounds and the option of keeping iMessage Proxy unchanged.
    validations:
      required: true
  - type: textarea
    id: security
    attributes:
      label: Security, privacy, and operational impact
      description: Address trust boundaries, authentication, allowlists, message data, logging, dependencies, migration, and rollback.
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Acceptance criteria
      description: List concrete tests or documentation that would demonstrate completion.
      placeholder: |
        - [ ] ...
        - [ ] ...
