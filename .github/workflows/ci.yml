name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Workflows and API contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up the pinned Node.js toolchain
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.2
          cache: npm
      - name: Install locked contract tools
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install verified actionlint
        shell: bash
        run: |
          archive="$RUNNER_TEMP/actionlint_1.7.12_linux_amd64.tar.gz"
          curl \
            --fail \
            --location \
            --proto '=https' \
            --proto-redir '=https' \
            --retry 3 \
            --silent \
            --show-error \
            --tlsv1.2 \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output "$archive"
          printf '%s  %s\n' \
            8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8 \
            "$archive" |
            sha256sum --check --status
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          chmod 0755 "$RUNNER_TEMP/actionlint"
      - name: Validate workflows
        run: '"$RUNNER_TEMP/actionlint"'
      - name: Validate OpenAPI contract
        run: npm run lint:openapi
      - name: Test the management console
        run: make test-ui
      - name: Test the one-command installer
        run: make test-installer
      - name: Test the uninstaller
        run: make test-uninstaller
      - name: Validate Caddy configuration with a pinned disposable image
        shell: bash
        run: |
          caddy_image='docker.io/library/caddy@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648'
          temporary="$(mktemp -d)"
          trap 'rm -rf -- "$temporary"' EXIT
          docker pull "$caddy_image"
          docker run --rm \
            --entrypoint caddy \
            --env IMESSAGE_PROXY_API_HOST=imessage-proxy.invalid \
            --env IMESSAGE_PROXY_ACME_EMAIL=ci@example.invalid \
            --env IMESSAGE_PROXY_EDGE_LOG_PATH=/tmp/caddy-edge.log \
            --env IMESSAGE_PROXY_HTTP_PORT=8080 \
            --env IMESSAGE_PROXY_HTTPS_PORT=8443 \
            --env IMESSAGE_PROXY_PUBLIC_BIND=127.0.0.1 \
            --env IMESSAGE_PROXY_SOCKET_PATH="$temporary/server.sock" \
            --env IMESSAGE_PROXY_UI_DIR="$PWD/web" \
            --mount "type=bind,source=$PWD/config/Caddyfile,target=/etc/caddy/Caddyfile,readonly" \
            --tmpfs /config \
            --tmpfs /data \
            "$caddy_image" \
            adapt --config /etc/caddy/Caddyfile --adapter caddyfile --validate

  caddy-edge:
    name: Caddy Unix-socket edge (ARM64)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test the host-edge configuration
        shell: bash
        run: bash tests/test-caddy-edge.sh

  check:
    name: Build, lint, analyze, and test
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up the pinned Node.js toolchain
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.2
          cache: npm
      - name: Install locked lint and contract tools
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Select verified native lint tools
        shell: bash
        run: |
          case "$(uname -m)" in
            arm64)
              shellcheck_archive='shellcheck-v0.11.0.darwin.aarch64.tar.gz'
              shellcheck_sha256='339b930feb1ea764467013cc1f72d09cd6b869ebf1013296ba9055ab2ffbd26f'
              ;;
            x86_64)
              shellcheck_archive='shellcheck-v0.11.0.darwin.x86_64.tar.gz'
              shellcheck_sha256='c2c15e08df0e8fbc374c335b230a7ee958c313fa5714817a59aa59f1aa594f51'
              ;;
            *)
              printf 'Unsupported macOS architecture: %s\n' "$(uname -m)" >&2
              exit 1
              ;;
          esac
          archive="$RUNNER_TEMP/$shellcheck_archive"
          curl \
            --fail \
            --location \
            --proto '=https' \
            --proto-redir '=https' \
            --retry 3 \
            --retry-all-errors \
            --silent \
            --show-error \
            --tlsv1.2 \
            "https://github.com/koalaman/shellcheck/releases/download/v0.11.0/$shellcheck_archive" \
            --output "$archive"
          printf '%s  %s\n' "$shellcheck_sha256" "$archive" |
            shasum -a 256 --check --status
          tar -xzf "$archive" -C "$RUNNER_TEMP"

          clang_format_dir="$(brew --prefix llvm@18)/bin"
          clang_format_version="$("$clang_format_dir/clang-format" --version)"
          [[ "$clang_format_version" == *'clang-format version 18.1.8'* ]] || {
            printf 'Unexpected runner clang-format: %s\n' "$clang_format_version" >&2
            exit 1
          }
          printf '%s\n' "$RUNNER_TEMP/shellcheck-v0.11.0" >> "$GITHUB_PATH"
          printf '%s\n' "$clang_format_dir" >> "$GITHUB_PATH"
      - name: Verify native lint-tool versions
        run: |
          test "$(shellcheck --version | awk '/^version:/ {print $2}')" = 0.11.0
          clang-format --version | grep -F 'clang-format version 18.1.8'
      - name: Install verified Caddy
        shell: bash
        run: |
          case "$(uname -m)" in
            arm64)
              archive_name='caddy_2.11.4_mac_arm64.tar.gz'
              archive_sha512='3190ae0df98b59ab4b6021556fa35adc3c526a4f3e138776b0eaec8a037cc26121cbbb1ad53453f565551b47d37d5ba4755e2c2c3652256737fe2ce9e53c8ec0'
              ;;
            x86_64)
              archive_name='caddy_2.11.4_mac_amd64.tar.gz'
              archive_sha512='e04eb10f9ce7e2e079bc9bff1bd5d3a3164888d1edbb1a49e5d15be4eab691b57e89ed36bb29c65ba43f1ba8d9279e0967b1003991c13fe4cb78384c3caf25de'
              ;;
            *)
              printf 'Unsupported macOS architecture: %s\n' "$(uname -m)" >&2
              exit 1
              ;;
          esac
          archive="$RUNNER_TEMP/$archive_name"
          curl \
            --fail \
            --location \
            --proto '=https' \
            --retry 3 \
            --retry-all-errors \
            --silent \
            --show-error \
            --tlsv1.2 \
            "https://github.com/caddyserver/caddy/releases/download/v2.11.4/$archive_name" \
            --output "$archive"
          printf '%s  %s\n' "$archive_sha512" "$archive" |
            shasum -a 512 --check --status
          tar -xzf "$archive" -C "$RUNNER_TEMP" caddy
          chmod 0755 "$RUNNER_TEMP/caddy"
          printf '%s\n' "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Verify the product edge version
        run: test "$(caddy version | awk '{print $1}')" = v2.11.4
      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun clang --version
      - name: Run all checks
        run: make check STRICT=1
      - name: Verify version consistency
        run: |
          expected="$(< VERSION)"
          test "$(build/imessage-proxy-server version)" = "$expected"
          test "$(bin/imessage-proxy version)" = "$expected"
      - name: Upload unsigned CI server
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unsigned-imessage-proxy-server-${{ runner.arch }}
          path: build/imessage-proxy-server
          if-no-files-found: error
          retention-days: 7

  install-smoke-test:
    name: Install layout
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check executable modes
        run: |
          test -x bin/imessage-proxy
          test -x scripts/install.sh
          test -x scripts/uninstall.sh
          test -x tests/test-caddy-edge.sh
          test -x tests/test-imessage-proxy-server.sh
          test -x tests/test-imessage-proxy-cli.sh
          test -x tests/test-install-script.sh
          test -x tests/test-uninstall-script.sh
      - name: Stage install and uninstall
        run: |
          stage="$(mktemp -d)"
          make install STRICT=1 DESTDIR="$stage" PREFIX=/usr/local
          test "$("$stage/usr/local/bin/imessage-proxy" version)" = "$(< VERSION)"
          test -f "$stage/usr/local/share/imessage-proxy/VERSION"
          test -f "$stage/usr/local/share/imessage-proxy/src/imessage-proxy-server.m"
          test -f "$stage/usr/local/share/imessage-proxy/src/api-key-store.h"
          test -f "$stage/usr/local/share/imessage-proxy/config/Caddyfile"
          test -f "$stage/usr/local/share/imessage-proxy/config/io.github.mglaeser.imessage-proxy.edge.plist.in"
          test -f "$stage/usr/local/share/imessage-proxy/config/io.github.mglaeser.imessage-proxy.plist.in"
          test -f "$stage/usr/local/share/imessage-proxy/web/index.html"
          make uninstall DESTDIR="$stage" PREFIX=/usr/local
          test ! -e "$stage/usr/local/bin/imessage-proxy"
          test ! -e "$stage/usr/local/share/imessage-proxy"
