name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Workflows and API contract
    runs-on: ubuntu-latest
    # Raised from 10 for the native unit tier, which adds a toolchain build when
    # scripts/linux-toolchain.sh changes and its cache key with it. Measured, not
    # estimated: that cold build takes about ninety seconds on this runner and
    # about forty-five on a five-core arm64 host, against a job that is otherwise
    # two minutes. The first version of this comment claimed twenty-five minutes,
    # which was wrong on both platforms and is the reason the number is now one
    # somebody measured. Twenty is roughly ten times the observed cold path -
    # enough that a slower runner or a heavier dependency has room, and low enough
    # that a genuinely hung build is not left burning a runner for three quarters
    # of an hour.
    timeout-minutes: 20
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up the pinned Node.js toolchain
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.2
          cache: npm
      - name: Install locked contract tools
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install verified actionlint
        shell: bash
        run: |
          archive="$RUNNER_TEMP/actionlint_1.7.12_linux_amd64.tar.gz"
          curl \
            --fail \
            --location \
            --proto '=https' \
            --proto-redir '=https' \
            --retry 3 \
            --silent \
            --show-error \
            --tlsv1.2 \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output "$archive"
          printf '%s  %s\n' \
            8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8 \
            "$archive" |
            sha256sum --check --status
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          chmod 0755 "$RUNNER_TEMP/actionlint"
      - name: Validate workflows
        run: '"$RUNNER_TEMP/actionlint"'
      # actionlint reads one workflow at a time, so it cannot see a release gate
      # waiting on a check whose job was deleted from another file.
      - name: Verify the release gate against the jobs that exist
        run: make test-workflows
      - name: Validate OpenAPI contract
        run: npm run lint:openapi
      - name: Test the management console
        run: make test-ui
      - name: Verify the key-store schema and native invariants
        run: make test-schema
      - name: Test the one-command installer
        run: make test-installer
      - name: Test the uninstaller
        run: make test-uninstaller
      # macOS ships bash 3.2 and the scripts run under whatever bash PATH
      # resolves, so interpreter-dependent behaviour has to fail here rather
      # than on an operator's Mac.
      - name: Test bash compatibility across supported interpreters
        run: make test-bash-compat
      # The native unit tier compiles the shipping Objective-C sources with ARC
      # on a Linux runner, which needs an Objective-C runtime and a Foundation
      # that Debian and Ubuntu do not package; scripts/linux-toolchain.sh builds
      # both from source under $HOME, without sudo. A cold build costs about
      # ninety seconds, and it is cached on the hash of the provisioner
      # itself: change that script and the next run rebuilds, leave
      # it alone and the next run restores in seconds. Only $HOME/.local/opt is
      # cached. The compiler-driver wrappers in $HOME/.local/bin are the one
      # artefact that encodes the script's own text, so they are regenerated on
      # every run, which the provisioner does in under a second.
      - name: Restore the Linux Objective-C toolchain
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/opt
          key: linux-objc-toolchain-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/linux-toolchain.sh') }}
      - name: Provision the Linux Objective-C toolchain
        run: bash scripts/linux-toolchain.sh
      - name: Test the native leaf functions
        run: make test-native

  check:
    name: Build, lint, analyze, and test
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up the pinned Node.js toolchain
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.2
          cache: npm
      - name: Install locked lint and contract tools
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Select verified native lint tools
        shell: bash
        run: |
          case "$(uname -m)" in
            arm64)
              shellcheck_archive='shellcheck-v0.11.0.darwin.aarch64.tar.gz'
              shellcheck_sha256='339b930feb1ea764467013cc1f72d09cd6b869ebf1013296ba9055ab2ffbd26f'
              ;;
            x86_64)
              shellcheck_archive='shellcheck-v0.11.0.darwin.x86_64.tar.gz'
              shellcheck_sha256='c2c15e08df0e8fbc374c335b230a7ee958c313fa5714817a59aa59f1aa594f51'
              ;;
            *)
              printf 'Unsupported macOS architecture: %s\n' "$(uname -m)" >&2
              exit 1
              ;;
          esac
          archive="$RUNNER_TEMP/$shellcheck_archive"
          curl \
            --fail \
            --location \
            --proto '=https' \
            --proto-redir '=https' \
            --retry 3 \
            --retry-all-errors \
            --silent \
            --show-error \
            --tlsv1.2 \
            "https://github.com/koalaman/shellcheck/releases/download/v0.11.0/$shellcheck_archive" \
            --output "$archive"
          printf '%s  %s\n' "$shellcheck_sha256" "$archive" |
            shasum -a 256 --check --status
          tar -xzf "$archive" -C "$RUNNER_TEMP"

          clang_format_dir="$(brew --prefix llvm@18)/bin"
          clang_format_version="$("$clang_format_dir/clang-format" --version)"
          [[ "$clang_format_version" == *'clang-format version 18.1.8'* ]] || {
            printf 'Unexpected runner clang-format: %s\n' "$clang_format_version" >&2
            exit 1
          }
          printf '%s\n' "$RUNNER_TEMP/shellcheck-v0.11.0" >> "$GITHUB_PATH"
          printf '%s\n' "$clang_format_dir" >> "$GITHUB_PATH"
      - name: Verify native lint-tool versions
        run: |
          test "$(shellcheck --version | awk '/^version:/ {print $2}')" = 0.11.0
          clang-format --version | grep -F 'clang-format version 18.1.8'
      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun clang --version
      - name: Run all checks
        run: make check STRICT=1
      - name: Verify version consistency
        run: |
          expected="$(< VERSION)"
          test "$(build/imessage-proxy-server version)" = "$expected"
          test "$(bin/imessage-proxy version)" = "$expected"
      # The release attaches a universal binary, and the release workflow only
      # runs on a tag. Building it here too means a break in that path is a
      # failed pull request rather than a failed release - which is the same
      # lesson the stuck v1.0.0 draft taught, where nothing exercised the release
      # path until a tag existed. It builds into its own directory so the
      # single-architecture binary the steps above verified is left alone.
      # The runner is arm64, so this proves the arm64 slice runs. The x86_64 slice
      # is verified by lipo and codesign alone; no Intel runner is in this matrix.
      - name: Build the universal binary the release attaches
        run: make release-binary STRICT=1
      - name: Upload unsigned CI server
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unsigned-imessage-proxy-server-${{ runner.arch }}
          path: build/imessage-proxy-server
          if-no-files-found: error
          retention-days: 7

  install-smoke-test:
    name: Install layout
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check executable modes
        run: |
          test -x bin/imessage-proxy
          test -x scripts/install.sh
          test -x scripts/uninstall.sh
          test -x tests/test-imessage-proxy-server.sh
          test -x tests/test-imessage-proxy-cli.sh
          test -x tests/test-install-script.sh
          test -x tests/test-uninstall-script.sh
      - name: Stage install and uninstall
        run: |
          stage="$(mktemp -d)"
          make install STRICT=1 DESTDIR="$stage" PREFIX=/usr/local
          test "$("$stage/usr/local/bin/imessage-proxy" version)" = "$(< VERSION)"
          test -f "$stage/usr/local/share/imessage-proxy/VERSION"
          test -f "$stage/usr/local/share/imessage-proxy/src/imessage-proxy-server.m"
          test -f "$stage/usr/local/share/imessage-proxy/src/api-key-store.h"
          test -f "$stage/usr/local/share/imessage-proxy/config/io.github.mglaeser.imessage-proxy.plist.in"
          test -f "$stage/usr/local/share/imessage-proxy/web/index.html"
          make uninstall DESTDIR="$stage" PREFIX=/usr/local
          test ! -e "$stage/usr/local/bin/imessage-proxy"
          test ! -e "$stage/usr/local/share/imessage-proxy"
