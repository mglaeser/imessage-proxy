name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Workflows and API contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install verified actionlint
        shell: bash
        run: |
          archive="$RUNNER_TEMP/actionlint_1.7.12_linux_amd64.tar.gz"
          curl \
            --fail \
            --location \
            --proto '=https' \
            --retry 3 \
            --silent \
            --show-error \
            --tlsv1.2 \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output "$archive"
          printf '%s  %s\n' \
            8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8 \
            "$archive" |
            sha256sum --check --status
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          chmod 0755 "$RUNNER_TEMP/actionlint"
      - name: Validate workflows
        run: |
          "$RUNNER_TEMP/actionlint"
      - name: Validate OpenAPI contract
        run: npx --yes @redocly/cli@2.46.0 lint openapi.yaml

  check:
    name: Build, lint, and test
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install lint tools
        run: brew install caddy clang-format markdownlint-cli2 shellcheck
      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun clang --version
      - name: Run all checks
        run: make check STRICT=1
      - name: Verify version consistency
        run: |
          expected="$(< VERSION)"
          test "$(build/imessage-proxy-bridge version)" = "$expected"
          test "$(bin/imessage-proxy version)" = "$expected"
          test "$(bin/stella version)" = "$expected"
      - name: Upload unsigned CI bridge
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unsigned-imessage-proxy-bridge-${{ runner.arch }}
          path: build/imessage-proxy-bridge
          if-no-files-found: error
          retention-days: 7

  install-smoke-test:
    name: Install layout
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check executable modes
        run: |
          test -x bin/imessage-proxy
          test -x bin/stella
          test -x tests/test-imessage-proxy-bridge.sh
          test -x tests/test-imessage-proxy-cli.sh
      - name: Stage install and uninstall
        run: |
          stage="$(mktemp -d)"
          make install STRICT=1 DESTDIR="$stage" PREFIX=/usr/local
          test "$("$stage/usr/local/bin/imessage-proxy" version)" = "$(< VERSION)"
          test "$("$stage/usr/local/bin/stella" version)" = "$(< VERSION)"
          test -f "$stage/usr/local/share/imessage-proxy/VERSION"
          test -f "$stage/usr/local/share/imessage-proxy/src/imessage-proxy-bridge.m"
          test -f "$stage/usr/local/share/imessage-proxy/config/Caddyfile"
          test -f "$stage/usr/local/share/imessage-proxy/config/io.github.mglaeser.stella.plist.in"
          test -f "$stage/usr/local/share/imessage-proxy/config/imessage-proxy.env.example"
          make uninstall DESTDIR="$stage" PREFIX=/usr/local
          test ! -e "$stage/usr/local/bin/imessage-proxy"
          test ! -e "$stage/usr/local/bin/stella"
          test ! -e "$stage/usr/local/share/imessage-proxy"
