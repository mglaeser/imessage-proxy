name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source-release:
    name: Source archive and provenance
    if: github.ref_type == 'tag'
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      attestations: write
      checks: read
      contents: write
      id-token: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require the tagged commit on main
        shell: bash
        run: |
          git fetch --no-tags origin \
            '+refs/heads/main:refs/remotes/origin/main'
          git merge-base --is-ancestor \
            "$GITHUB_SHA" refs/remotes/origin/main
          tag_ref="refs/tags/$GITHUB_REF_NAME^{}"
          tag_record="$(git ls-remote --exit-code origin "$tag_ref")"
          test "$tag_record" = "$GITHUB_SHA"$'\t'"$tag_ref"
      - name: Require successful main checks
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          check_runs="$(gh api \
            -H 'Accept: application/vnd.github+json' \
            "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs?per_page=100")"
          for required_check in \
            'Workflows and API contract' \
            'Caddy facade integration (ARM64)' \
            'Build, lint, and test' \
            'Install layout' \
            'Analyze GitHub Actions' \
            'Gitleaks' \
            'Supply-chain analysis'; do
            jq -e --arg name "$required_check" '
              any(.check_runs[];
                .name == $name and
                .status == "completed" and
                .conclusion == "success")
            ' <<< "$check_runs" >/dev/null || {
              printf 'Required check is not successful: %s\n' \
                "$required_check" >&2
              exit 1
            }
          done
      - name: Validate release version
        id: metadata
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          test "$GITHUB_REF_NAME" = "v$version"
          test "$version" = "$(make --no-print-directory version)"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
      - name: Install validation tools
        run: brew install caddy clang-format markdownlint-cli2 shellcheck
      - name: Revalidate tagged source
        run: |
          make check STRICT=1
          npx --yes @redocly/cli@2.46.0 lint openapi.yaml
      - name: Create source archive and checksum
        env:
          VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          set -o pipefail
          mkdir -p dist
          export COPYFILE_DISABLE=1
          git archive --format=tar --prefix="imessage-proxy-$VERSION/" "$GITHUB_SHA" |
            gzip -n -9 > "dist/imessage-proxy-$VERSION.tar.gz"
          cd dist
          shasum -a 256 "imessage-proxy-$VERSION.tar.gz" > SHA256SUMS
      - name: Attest source archive
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/imessage-proxy-${{ steps.metadata.outputs.version }}.tar.gz
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          verify_remote_tag() {
            local tag_record tag_ref
            tag_ref="refs/tags/$GITHUB_REF_NAME^{}"
            tag_record="$(git ls-remote --exit-code origin "$tag_ref")"
            test "$tag_record" = "$GITHUB_SHA"$'\t'"$tag_ref"
          }
          verify_remote_tag
          archive="dist/imessage-proxy-${{ steps.metadata.outputs.version }}.tar.gz"
          archive_name="${archive##*/}"
          if release_is_draft="$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft 2>/dev/null)"; then
            if [[ "$release_is_draft" != true ]]; then
              temporary="$(mktemp -d)"
              trap 'rm -rf -- "$temporary"' EXIT
              gh release download "$GITHUB_REF_NAME" \
                --dir "$temporary" \
                --pattern SHA256SUMS \
                --pattern "$archive_name"
              cmp -s dist/SHA256SUMS "$temporary/SHA256SUMS"
              cmp -s "$archive" "$temporary/$archive_name"
              verify_remote_tag
              printf 'Published release assets already match this tag; no mutation required.\n'
              exit 0
            fi
          else
            gh release create "$GITHUB_REF_NAME" \
              --draft \
              --generate-notes \
              --title "iMessage Proxy $GITHUB_REF_NAME" \
              --verify-tag
          fi
          gh release upload "$GITHUB_REF_NAME" dist/SHA256SUMS "$archive" --clobber
          verify_remote_tag
          gh release edit "$GITHUB_REF_NAME" --draft=false
